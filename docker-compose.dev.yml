services:
  # docker socket proxy - secure access to docker api
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    environment:
      - CONTAINERS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - valheim-network

  valheim-server:
    image: lloesche/valheim-server:latest
    container_name: valheim-server
    volumes:
      - ./valheim-config:/config
      - ./valheim-data:/opt/valheim
    ports:
      - "2456-2457:2456-2457/udp"
      - "2456-2457:2456-2457/tcp"
      - "80:80/tcp" # status http
    environment:
      - SERVER_NAME=${SERVER_NAME:-My Valheim Server}
      - WORLD_NAME=${WORLD_NAME:-Dedicated}
      - SERVER_PASS=${SERVER_PASS:-secret}
      - SERVER_PUBLIC=true
      - STATUS_HTTP=true
      - STATUS_HTTP_PORT=80
      - STATUS_HTTP_CONF=/config/httpd.conf
    restart: unless-stopped
    networks:
      - valheim-network

  # valheim server controller api
  server:
    container_name: server
    build:
      context: .
      dockerfile: docker/server/Dockerfile.dev
    environment:
      - NODE_ENV=development
      - DOCKER_HOST=tcp://docker-proxy:2375
      - VALHEIM_CONTAINER_NAME=valheim-server
      - API_KEY=${API_KEY}
      - IDLE_TIMEOUT_MINUTES=${IDLE_TIMEOUT_MINUTES:-30}
    volumes:
      - ./packages/server:/app
      - ./packages/server/node_modules:/app/node_modules
    depends_on:
      - docker-proxy
      - valheim-server
    restart: unless-stopped
    networks:
      - valheim-network

  # valheim web client
  client:
    container_name: client
    build:
      context: .
      dockerfile: docker/client/Dockerfile.dev
    ports:
      - "8080:5173"
    volumes:
      - ./packages/client:/app
      - ./packages/client/node_modules:/app/node_modules
    depends_on:
      - server
    networks:
      - valheim-network

networks:
  valheim-network:
    driver: bridge
